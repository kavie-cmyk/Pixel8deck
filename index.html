<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel8Labs Client Deck</title><style>html,body{margin:0;background:#050208;color:#fff;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center}.loading div{opacity:.75}</style></head><body><div class="loading"><div>Loading Pixel8Labs deck…</div></div><script>(async()=>{try{let html='';for(let i=1;i<=5;i++){const n=String(i).padStart(2,'0');const r=await fetch(`htmlpart/${n}.txt`,{cache:'no-store'});if(!r.ok)throw new Error(`Missing part ${n}`);html+=await r.text();}document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="loading"><div>Unable to load deck.</div></div>';console.error(e);}})();</script></body></html>
