<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel8Labs — Client Deck</title><meta name="description" content="Pixel8Labs is an AI-enabled product studio helping teams decide what to build, ship production products, automate manual work, grow and secure what they launch."><meta name="theme-color" content="#12051d"><link rel="canonical" href="https://kavie-cmyk.github.io/Pixel8deck/"><meta property="og:type" content="website"><meta property="og:title" content="Pixel8Labs — Client Deck"><meta property="og:description" content="From product decisions to engineering, AI automation, growth and security."><meta property="og:url" content="https://kavie-cmyk.github.io/Pixel8deck/"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Pixel8Labs — Client Deck"><meta name="twitter:description" content="From product decisions to engineering, AI automation, growth and security."><style>html,body{margin:0;background:#050208;color:#fff;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center}.loading div{opacity:.75}.loading:after{content:"";position:fixed;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#ff4d9b,#8d35ff,#3257ff);transform-origin:left;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{from{transform:scaleX(.18)}to{transform:scaleX(.92)}}@media(prefers-reduced-motion:reduce){.loading:after{animation:none;transform:scaleX(.6)}}</style></head><body><div class="loading"><div>Loading Pixel8Labs deck…</div></div><script>(async()=>{try{const partJobs=Array.from({length:5},async(_,i)=>{const n=String(i+1).padStart(2,'0');const r=await fetch(`htmlpart/${n}.txt`,{cache:'no-store'});if(!r.ok)throw new Error(`Missing part ${n}`);return r.text();});const imageJobs=Array.from({length:12},async(_,i)=>{const n=String(i+1).padStart(2,'0');try{const r=await fetch(`imgdata/${n}.txt`,{cache:'force-cache'});if(!r.ok)return[n,null];return[n,(await r.text()).trim()];}catch{return[n,null];}});const [parts,imagePairs]=await Promise.all([Promise.all(partJobs),Promise.all(imageJobs)]);let html=parts.join('');for(const [key,b64] of imagePairs){if(!b64)continue;html=html.replaceAll(`data-img="${key}" src=""`,`data-img="${key}" src="data:image/jpeg;base64,${b64}"`);}document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="loading"><div>Unable to load deck. Please refresh the page.</div></div>';console.error(e);}})();</script></body></html>
